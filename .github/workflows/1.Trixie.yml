name: 1.Build MiniOS Trixie
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune -a -f
      
      - name: Install Dependencies
        run: |
         sudo apt-get update
         sudo apt-get install -y 7zip curl git wget ca-certificates binutils debootstrap \
           squashfs-tools xz-utils lz4 zstd xorriso mtools rsync grub-efi-amd64-bin \
           grub-pc-bin grub-common
           
      - name: Download, Decompress and Build
        run: |
          wget -q https://github.com/1compk/minios/releases/download/live/zMinios.Skyline.Build.03.2026.tar.xz
          tar -xf zMinios.Skyline.Build.03.2026.tar.xz 
          cd zMinios.Skyline.Build.03.2026/
          sudo sh trixie.xfce.build.sh

      - name: Upload MiniOS.Trixie.iSO
        uses: actions/upload-artifact@v4
        with:
          name: MiniOS.Trixie.ISO
          path: zMinios.Skyline.Build.03.2026/build/iso/*.iso*
          if-no-files-found: error
          retention-days: 15
          
      - name: Upload MiniOS.Trixie.SB
        uses: actions/upload-artifact@v4
        with:
          name: MiniOS.Trixie.SB
          path: zMinios.Skyline.Build.03.2026/build/trixie-standard-amd64/image/minios/*.sb*
          if-no-files-found: error
          retention-days: 15
